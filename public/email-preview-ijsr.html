<style type="text/css">

  body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

</style>
</head>
<body bgcolor="#f1f5f9">

<table cellspacing="0" cellpadding="0" border="0" align="center" width="640" class="deviceWidth" style="width: 640px; margin: 24px auto; background-color: #ffffff; border-radius: 14px; overflow: hidden; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); border: 1px solid #e2e8f0;">

  <!-- 1. Hero Visual Card (IJSR Swiss Poster Graphic) -->
  <tr>
    <td align="center" style="padding: 0; background-color: #ffffff; line-height: 0; font-size: 0;">
      <a href="https://{{senderDomain}}/international-journal-of-scientific-research-(IJSR)/page/p/upload-your-article" target="_blank" style="text-decoration: none; display: block;">
        <img src="https://mailapp.balajiimpex.store/IJSR-email.jpg" alt="Publish Your Research - International Journal of Scientific Research" width="640" height="640" decoding="sync" fetchpriority="high" class="deviceWidth heroCard" style="width: 100%; max-width: 640px; height: auto; aspect-ratio: 1 / 1; display: block; border: 0; border-top-left-radius: 14px; border-top-right-radius: 14px;" />
      </a>
    </td>
  </tr>

  <!-- 2. Primary High-Converting CTA Button -->
  <tr>
    <td align="center" style="padding: 28px 24px 26px; background-color: #ffffff;">

        <tr>
          <td align="center" bgcolor="#0076fe" style="border-radius: 50px; box-shadow: 0 4px 14px rgba(0, 118, 254, 0.35);">
            <a href="https://{{senderDomain}}/international-journal-of-scientific-research-(IJSR)/page/p/upload-your-article" target="_blank" class="ctaButton" style="font-size: 16px; font-weight: 700; color: #ffffff; text-decoration: none; padding: 16px 42px; display: inline-block; border-radius: 50px; text-transform: uppercase; letter-spacing: 0.5px;">
              Submit Your Manuscript Online &rarr;
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <!-- 3. Legal Compliance & One-Click Unsubscribe Footer -->
  <tr>
    <td style="padding: 18px 24px; background-color: #f1f5f9; text-align: center; border-top: 1px solid #e2e8f0;">
      <p style="font-size: 11px; color: #94a3b8; margin: 0; line-height: 16px;">
        To permanently cease future calls for papers, click <a href="https://{{senderDomain}}/international-journal-of-scientific-research-(IJSR)/page/p/OptOut" style="color: #0284c7; text-decoration: underline; font-weight: 600;">One-Click Unsubscribe / Opt Out</a>.
      </p>
    </td>
