name: Rapid & Secure Azure Web App Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --omit=dev

      # Package essential files with ultra-fast compression level 1
      - name: Create Clean Lightweight Archive
        run: |
          zip -q -1 -r release.zip server.js package.json package-lock.json src public node_modules

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EECFD65A373B4B7B964F0D953BC008D4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ADDF7064233A4843AD97AC6BDD366422 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B86E2BDB93B14E92B6BD707FD34B6FE2 }}

      # Disable Oryx build — we already ship node_modules in the zip.
      # Without this, Oryx compresses node_modules into tar.zst + broken symlink → 503
      - name: Disable Azure Oryx Build
        run: |
          az webapp config appsettings set --name paripex-mailer-app \
            --resource-group rg-mailer-autoamtion \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false

      # Fast Zip Deploy and reload process
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'paripex-mailer-app'
          slot-name: 'Production'
          package: release.zip
          clean: true
          restart: true

