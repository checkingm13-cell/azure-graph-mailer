name: Rapid & Secure Azure Web App Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # 1. Code Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js (Node 20.x is highly optimized for Azure App Service)
      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Secure & Clean Dependency Installation
      - name: Install Dependencies
        run: |
          npm ci --omit=dev

      # 4. Security Audit (Non-blocking)
      - name: Security Check
        run: |
          npm audit --audit-level=high || echo "⚠️ Security warnings found"

      # 5. Azure Authentication via OIDC
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EECFD65A373B4B7B964F0D953BC008D4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ADDF7064233A4843AD97AC6BDD366422 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B86E2BDB93B14E92B6BD707FD34B6FE2 }}

      # 6. Direct & Rapid Deployment to Azure
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'paripex-mailer-app'
          slot-name: 'Production'
          package: .
